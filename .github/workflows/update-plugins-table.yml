name: Update Plugins Table

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch plugins and update README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: TachlisGeredt
          PLUGIN_TOPIC: menubarplugins-plugin
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          owner = os.environ["GITHUB_OWNER"]
          topic = os.environ["PLUGIN_TOPIC"]
          token = os.environ.get("GITHUB_TOKEN", "")
          max_desc_len = 120

          query = urllib.parse.quote(f"user:{owner} topic:{topic}")
          url = f"https://api.github.com/search/repositories?q={query}&per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "MenuBarPlugins-Readme-Updater",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.loads(resp.read().decode("utf-8"))

          repos = [
              r for r in data.get("items", [])
              if not r.get("archived", False)
          ]
          repos.sort(key=lambda r: r["name"].lower())

          def clean_description(text: str) -> str:
              cleaned = " ".join((text or "").split()).replace("|", "\\|")
              if not cleaned:
                  return "MenuBarPlugins plugin."
              if len(cleaned) > max_desc_len:
                  cleaned = cleaned[: max_desc_len - 1].rstrip() + "…"
              return cleaned

          rows = [
              "| Plugin | Description |",
              "| --- | --- |",
          ]
          for repo in repos:
              name = repo["name"].replace("|", "\\|")
              html_url = repo["html_url"]
              desc = clean_description(repo.get("description") or "")
              rows.append(f"| [{name}]({html_url}) | {desc} |")

          if len(repos) == 0:
              rows.append("| _None yet_ | Tag a plugin repo with `menubarplugins-plugin` to list it here. |")

          table_block = "<!-- PLUGINS:START -->\n" + "\n".join(rows) + "\n<!-- PLUGINS:END -->"

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- PLUGINS:START -->.*?<!-- PLUGINS:END -->"
          if not re.search(pattern, readme, flags=re.DOTALL):
              raise SystemExit("Error: PLUGINS markers not found in README.md")

          updated = re.sub(pattern, lambda _: table_block, readme, count=1, flags=re.DOTALL)
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit and push if README.md changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes to README.md."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update plugins table in README.md"
          git push
